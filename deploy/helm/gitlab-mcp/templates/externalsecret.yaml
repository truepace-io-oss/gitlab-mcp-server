{{- $root := . }}
{{- $eso := .Values.externalSecrets }}
{{- /* Per-instance credentials (the GitLab token, optional private CA). */ -}}
{{- range .Values.instances }}
{{- $hasToken := and .token .token.esoRef }}
{{- $hasCA := and .tls .tls.caEsoRef }}
{{- if and $eso.enabled (or $hasToken $hasCA) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gitlab-mcp.instanceSecretName" (dict "root" $root "instance" .) }}
  labels:
    {{- include "gitlab-mcp.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    kind: {{ $eso.secretStore.kind }}
    name: {{ $eso.secretStore.name }}
  target:
    name: {{ include "gitlab-mcp.instanceSecretName" (dict "root" $root "instance" .) }}
    creationPolicy: Owner
  data:
    {{- if $hasToken }}
    - secretKey: token
      remoteRef:
        key: {{ .token.esoRef | quote }}
    {{- end }}
    {{- if $hasCA }}
    - secretKey: ca.crt
      remoteRef:
        key: {{ .tls.caEsoRef | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- /* Static agent-auth bearer tokens via ESO (one Secret per token, key `token`). */ -}}
{{- if and .Values.auth.enabled .Values.auth.static.enabled }}
{{- range .Values.auth.static.tokens }}
{{- if and $eso.enabled .eso }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gitlab-mcp.fullname" $root }}-auth-{{ .name }}
  labels:
    {{- include "gitlab-mcp.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    kind: {{ $eso.secretStore.kind }}
    name: {{ $eso.secretStore.name }}
  target:
    name: {{ include "gitlab-mcp.fullname" $root }}-auth-{{ .name }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ .eso.ref | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Image pull secret (dockerconfigjson) via ESO. */ -}}
{{- if and $eso.enabled .Values.imagePullSecret.esoRef }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gitlab-mcp.fullname" . }}-pull
  labels:
    {{- include "gitlab-mcp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    kind: {{ $eso.secretStore.kind }}
    name: {{ $eso.secretStore.name }}
  target:
    name: {{ include "gitlab-mcp.fullname" . }}-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ .Values.imagePullSecret.esoRef | quote }}
{{- end }}
{{- /* Optional ingress basic-auth htpasswd via ESO. */ -}}
{{- if and $eso.enabled .Values.ingress.enabled .Values.ingress.basicAuth.enabled .Values.ingress.basicAuth.esoRef }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gitlab-mcp.fullname" . }}-basic-auth
  labels:
    {{- include "gitlab-mcp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    kind: {{ $eso.secretStore.kind }}
    name: {{ $eso.secretStore.name }}
  target:
    name: {{ include "gitlab-mcp.fullname" . }}-basic-auth
    creationPolicy: Owner
  data:
    - secretKey: auth
      remoteRef:
        key: {{ .Values.ingress.basicAuth.esoRef | quote }}
{{- end }}
