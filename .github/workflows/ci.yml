name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # ---- Unit tests ----------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l -d . && exit 1)
      - run: go test ./internal/... -race -count=1

  # ---- End-to-end against an in-process fake GitLab ------------------------
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./test/e2e/... -race -count=1

  # ---- Scope guards --------------------------------------------------------
  # These keep the project's promises honest: the surfaces below are permanent
  # non-goals, so reintroducing one should fail CI rather than pass review.
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No filesystem reads or alternative transports
        run: |
          ! grep -rnE 'StdioTransport|filepath\.Walk|os\.ReadDir' \
            --include='*.go' internal/mcpserver internal/gitlab main.go
      - name: No Premium/Ultimate or scanning endpoints
        run: |
          ! grep -rnE 'vulnerability_findings|/dependencies|api/graphql|audit_events' \
            --include='*.go' internal/gitlab/api.go
      - name: No project, repository, issue or MR writes
        run: |
          ! grep -rnE 'func \(c \*Client\) (Create|Update|Delete)Project|CreateIssue|CreateMergeRequest|CommitFile' \
            --include='*.go' internal/gitlab

  # ---- Helm chart lint + template validation -------------------------------
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint deploy/helm/gitlab-mcp
      - name: Template (defaults, an instance, auth/OIDC, monitoring)
        run: |
          helm template t deploy/helm/gitlab-mcp > /dev/null
          helm template t deploy/helm/gitlab-mcp \
            --set 'instances[0].name=gitlab' \
            --set 'instances[0].url=https://gitlab.example.com' \
            --set 'instances[0].token.esoRef=uuid' \
            --set 'instances[0].permissions.read.core=true' \
            --set 'config.defaultInstance=gitlab' > /dev/null
          # The RFC 9728 resource identifier must be rendered, not the audience.
          helm template t deploy/helm/gitlab-mcp \
            --set 'instances[0].name=gitlab' \
            --set 'instances[0].url=https://gitlab.example.com' \
            --set 'config.defaultInstance=gitlab' \
            --set auth.enabled=true --set auth.oidc.enabled=true \
            --set auth.oidc.issuer=https://auth.example.com/application/o/gitlab-mcp/ \
            --set auth.oidc.audience=gitlab-mcp \
            --set auth.oidc.resource=https://gitlab-mcp.example.com/mcp \
            | grep -q 'resource: "https://gitlab-mcp.example.com/mcp"'
          helm template t deploy/helm/gitlab-mcp \
            --set serviceMonitor.enabled=true --set grafanaDashboard.enabled=true > /dev/null

  # ---- Multi-arch image build + push to GHCR -------------------------------
  build-and-push:
    needs: [test, e2e, scope, helm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Helm chart release (OCI) --------------------------------------------
  publish-chart:
    needs: [helm, build-and-push]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Package and push chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/gitlab-mcp --version "$VERSION" --app-version "$VERSION"
          helm push "gitlab-mcp-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
